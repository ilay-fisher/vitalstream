name: ci

# Cross-service pipeline: image build + vulnerability scan + publish, Terraform lint, and the
# end-to-end suite. Per-service lint/unit/integration workflows stay in their own files.
# Third-party actions are pinned to commit SHAs of releases older than two weeks (tag in comment).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/ilay-fisher/vitalstream

jobs:
  build:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ingest-gateway, context: services/ingest-gateway }
          - { service: stream-processor, context: services/stream-processor }
          - { service: clinical-api, context: services/clinical-api }
          - { service: copilot, context: services/copilot }
          - { service: simulator, context: tools/simulator }
          - { service: dashboard, context: web/dashboard }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # CRITICAL only, and only where a fix exists: a CVE nobody can patch yet is not actionable.
      - name: Trivy scan (fails on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNORE_POLICY: e2e/ci/trivy-ignore-${{ matrix.service }}.rego
          TRIVY_SECRET_CONFIG: e2e/ci/trivy-secret.yaml
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context and cache scope as the build above, so this is a cache hit, not a rebuild.
      - name: Push image (sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint (every Terraform root and module)
        working-directory: deploy/terraform
        run: tflint --recursive --format compact

  e2e-unit:
    name: e2e helpers (lint + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest

  e2e:
    name: e2e (compose stack)
    runs-on: ubuntu-latest
    needs: [build, e2e-unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
        working-directory: e2e
      - name: Run the sepsis pipeline suite against compose
        working-directory: e2e
        env:
          E2E_TEARDOWN: all
        run: uv run pytest -m e2e -o addopts="" -v -s
      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1 || true; echo "::endgroup::"
          done
