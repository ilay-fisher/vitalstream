name: stream-processor

on:
  push:
    branches: [main]
    paths:
      - "services/stream-processor/**"
      - ".github/workflows/stream-processor.yml"
  pull_request:
    paths:
      - "services/stream-processor/**"
      - ".github/workflows/stream-processor.yml"

defaults:
  run:
    working-directory: services/stream-processor

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/stream-processor/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/stream-processor/uv.lock
      - run: uv sync --frozen
      - name: Unit + Spark transformation tests with coverage
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: services/stream-processor/coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/stream-processor/uv.lock
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('services/stream-processor/src/stream_processor/config.py') }}
      - run: uv sync --frozen
      - name: Integration test (Testcontainers: Kafka, Cassandra, Redis)
        run: uv run pytest -m integration -s

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/stream-processor
          push: false
          load: true
          tags: vitalstream/stream-processor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and has connector jars
        run: |
          test "$(docker run --rm --entrypoint id vitalstream/stream-processor:ci -u)" != "0"
          docker run --rm --entrypoint sh vitalstream/stream-processor:ci -c 'ls /opt/spark/jars | grep -E "spark-sql-kafka|spark-cassandra-connector|hadoop-aws"'
