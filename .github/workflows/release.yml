name: release

# Tagging vX.Y.Z publishes semver-tagged images to GHCR and creates a GitHub release.
# Images are scanned first; a CRITICAL finding with an available fix blocks the release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/ilay-fisher/vitalstream

jobs:
  publish:
    name: publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ingest-gateway, context: services/ingest-gateway }
          - { service: stream-processor, context: services/stream-processor }
          - { service: clinical-api, context: services/clinical-api }
          - { service: copilot, context: services/copilot }
          - { service: simulator, context: tools/simulator }
          - { service: dashboard, context: web/dashboard }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags from the git tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan (fails on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNORE_POLICY: e2e/ci/trivy-ignore-${{ matrix.service }}.rego
          TRIVY_SECRET_CONFIG: e2e/ci/trivy-secret.yaml
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: "1"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push semver-tagged image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --generate-notes --verify-tag
