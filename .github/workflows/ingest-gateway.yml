name: ingest-gateway

on:
  push:
    branches: [main]
    paths:
      - "services/ingest-gateway/**"
      - ".github/workflows/ingest-gateway.yml"
  pull_request:
    paths:
      - "services/ingest-gateway/**"
      - ".github/workflows/ingest-gateway.yml"

defaults:
  run:
    working-directory: services/ingest-gateway

jobs:
  build:
    name: format, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/ingest-gateway/pom.xml

      - name: Spotless (google-java-format)
        run: ./mvnw -B -ntp spotless:check

      # verify = unit tests (surefire) + Testcontainers integration tests (failsafe)
      # + JaCoCo report + 80% line coverage gate.
      - name: Unit and integration tests with coverage gate
        run: ./mvnw -B -ntp verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-gateway-jacoco
          path: services/ingest-gateway/target/site/jacoco
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-gateway-test-reports
          path: |
            services/ingest-gateway/target/surefire-reports
            services/ingest-gateway/target/failsafe-reports
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vitalstream/ingest-gateway:ci .
