# Lightweight development infrastructure for the kind cluster. NOT for production: no persistence,
# single replicas, no TLS. Official upstream images, pinned to the versions infra/compose.yaml uses.
# Bitnami charts were not used because the free Bitnami images left Docker Hub in 2025.
#
# Required before applying (deploy/kind/up.sh creates both):
#   Secret  infra-credentials  keys POSTGRES_PASSWORD, RABBITMQ_PASSWORD
#   ConfigMap postgres-init    key init.sql (infra/postgres/init.sql)
#   ConfigMap es-init          infra/elasticsearch/*
apiVersion: v1
kind: Namespace
metadata:
  name: vitalstream-infra
---
# ---------------------------------------------------------------- Kafka (KRaft, single node)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: vitalstream-infra
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      # Without this Kubernetes injects KAFKA_PORT=tcp://..., which the image rejects.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports: [{name: kafka, containerPort: 9092}]
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.vitalstream-infra.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            # Dev convenience; the compose stack creates topics explicitly (infra/kafka/init-topics.sh).
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m"}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: vitalstream-infra
spec:
  selector: {app: kafka}
  ports: [{name: kafka, port: 9092, targetPort: kafka}]
---
# ---------------------------------------------------------------- Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vitalstream-infra
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vitalstream-infra
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
# ---------------------------------------------------------------- PostgreSQL + pgvector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vitalstream-infra
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.0-pg16
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: vitalstream}
            - {name: POSTGRES_USER, value: vitalstream}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: infra-credentials, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            # Idempotent bootstrap: extension vector, schemas clinical + copilot, seeded patients.
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: [pg_isready, -U, vitalstream, -d, vitalstream]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: init, configMap: {name: postgres-init}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vitalstream-infra
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
# ---------------------------------------------------------------- Elasticsearch (single node, security off)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: vitalstream-infra
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      enableServiceLinks: false
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          ports: [{name: http, containerPort: 9200}]
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: cluster.routing.allocation.disk.threshold_enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms384m -Xmx384m"}
          readinessProbe:
            httpGet: {path: "/_cluster/health?wait_for_status=yellow&timeout=5s", port: 9200}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: vitalstream-infra
spec:
  selector: {app: elasticsearch}
  ports: [{name: http, port: 9200, targetPort: http}]
---
# Creates the `alerts` and `guidelines` indices (same script as the compose stack).
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: vitalstream-infra
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: init
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "/init/init.sh"]
          env:
            - {name: ELASTICSEARCH_URL, value: "http://elasticsearch:9200"}
          volumeMounts:
            - {name: init, mountPath: /init}
      volumes:
        - {name: init, configMap: {name: es-init}}
