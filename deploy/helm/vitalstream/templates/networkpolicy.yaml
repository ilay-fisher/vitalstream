{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: vitalstream
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vitalstream
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    app.kubernetes.io/part-of: vitalstream
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vitalstream
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $p := $svc.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vs.name" $ctx }}
  labels:
    {{- include "vs.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vs.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or $p.infraPorts $p.egressToServices $p.egress.internet.enabled }}
  egress:
    {{- if $p.infraPorts }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.infra.namespaceSelector | nindent 14 }}
        {{- range $np.infra.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range $p.infraPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
    {{- range $p.egressToServices }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ . }}
              app.kubernetes.io/part-of: vitalstream
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - {port: {{ (get $.Values.services .).port }}, protocol: TCP}
    {{- end }}
    {{- if $p.egress.internet.enabled }}
    - to:
        {{- range $p.egress.internet.cidrs }}
        - ipBlock:
            cidr: {{ . }}
            {{- if eq . "0.0.0.0/0" }}
            except:
              {{- range concat $np.internetExceptCIDRs $np.clusterCIDRs }}
              - {{ . }}
              {{- end }}
            {{- end }}
        {{- end }}
      ports:
        {{- range $p.egress.internet.ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if or $p.ingressFromServices $p.allowIngressController $p.allowMonitoring }}
  ingress:
    - from:
        {{- range $p.ingressFromServices }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ . }}
              app.kubernetes.io/part-of: vitalstream
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
        {{- if $p.allowIngressController }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressControllerNamespaceSelector | nindent 14 }}
        {{- end }}
        {{- if $p.allowMonitoring }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.monitoringNamespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - {port: {{ $svc.port }}, protocol: TCP}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
