{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $required := list "INGEST_API_KEY" "COPILOT_ADMIN_TOKEN" "MCP_TOKEN" "LOG_PSEUDONYM_KEY" "POSTGRES_PASSWORD" "RABBITMQ_PASSWORD" }}
{{- $all := append $required "ANTHROPIC_API_KEY" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vs.secretName" . }}
  labels:
    app.kubernetes.io/part-of: vitalstream
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range $all }}
  {{- $v := index $.Values.secrets.values . | default "" | toString }}
  {{- if and (has . $required) (not $v) }}
  {{- fail (printf "secrets.values.%s is required when secrets.create=true" .) }}
  {{- end }}
  {{- if and $v (ne $.Values.global.appEnv "dev") (lt (len $v) (int $.Values.secrets.minLength)) }}
  {{- fail (printf "secrets.values.%s must be at least %v characters when global.appEnv is %s" . $.Values.secrets.minLength $.Values.global.appEnv) }}
  {{- end }}
  {{- if $v }}
  {{ . }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
