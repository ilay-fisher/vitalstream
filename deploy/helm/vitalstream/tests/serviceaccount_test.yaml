suite: service accounts
templates:
  - serviceaccount.yaml
tests:
  - it: IRSA role annotation is passed through for clinical-api
    set:
      services.clinical-api.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/vs-clinical-api
    documentSelector:
      path: metadata.name
      value: clinical-api
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/vs-clinical-api
  - it: service accounts do not auto-mount tokens
    documentSelector:
      path: metadata.name
      value: copilot
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
