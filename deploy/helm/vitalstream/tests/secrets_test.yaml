suite: secrets
templates:
  - deployment.yaml
  - secret.yaml
tests:
  - it: gateway reads its secrets from the secret, never inline
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: ingest-gateway
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: INGEST_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_PSEUDONYM_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: LOG_PSEUDONYM_KEY
  - it: copilot references admin token, mcp token, pseudonym key, db password and optional anthropic key
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: copilot
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COPILOT_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: COPILOT_ADMIN_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: MCP_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: POSTGRES_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: ANTHROPIC_API_KEY
                optional: true
  - it: clinical-api composes the broker url from the secret password
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: clinical-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_URL
            value: amqp://vitalstream:$(RABBITMQ_PASSWORD)@rabbitmq:5672
  - it: existingSecret overrides the secret name everywhere
    template: deployment.yaml
    set:
      secrets.existingSecret: my-secret
    documentSelector:
      path: metadata.name
      value: ingest-gateway
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_API_KEY
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: INGEST_API_KEY
  - it: no Secret object is rendered by default
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: no Secret object is rendered when existingSecret is set even with create
    template: secret.yaml
    set:
      secrets.create: true
      secrets.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
  - it: chart can create the secret from values supplied at install time
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
      secrets.values.CLINICAL_JWT_SECRET: "hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets
      - isNotEmpty:
          path: stringData.INGEST_API_KEY
  - it: created secret fails fast on a value shorter than 32 characters in prod
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: short
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
      secrets.values.CLINICAL_JWT_SECRET: "hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh"
    asserts:
      - failedTemplate:
          errorPattern: "at least 32"
  - it: created secret fails when a required value is missing
    template: secret.yaml
    set:
      secrets.create: true
    asserts:
      - failedTemplate:
          errorPattern: "secrets.values.INGEST_API_KEY"
  - it: clinical-api verifies tokens with CLINICAL_JWT_SECRET from the secret (optional, JWKS mode needs none)
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: clinical-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLINICAL_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: CLINICAL_JWT_SECRET
                optional: true
  - it: copilot gets its clinical-api service token from the secret and requires it
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: copilot
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLINICAL_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: CLINICAL_API_TOKEN
  - it: no other service receives the JWT secret or the copilot token
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: ingest-gateway
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLINICAL_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: CLINICAL_JWT_SECRET
                optional: true
  - it: created secret carries the JWT secret and the copilot token
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
      secrets.values.CLINICAL_JWT_SECRET: "hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh"
    asserts:
      - isNotEmpty:
          path: stringData.CLINICAL_JWT_SECRET
      - isNotEmpty:
          path: stringData.CLINICAL_API_TOKEN
  - it: created secret requires CLINICAL_API_TOKEN
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_JWT_SECRET: "hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh"
    asserts:
      - failedTemplate:
          errorPattern: "secrets.values.CLINICAL_API_TOKEN"
  - it: created secret requires CLINICAL_JWT_SECRET in HS256 mode
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
    asserts:
      - failedTemplate:
          errorPattern: "secrets.values.CLINICAL_JWT_SECRET"
  - it: created secret does not need an HMAC secret when a JWKS URI is configured
    template: secret.yaml
    set:
      auth.jwt.jwkSetUri: https://idp.example.org/.well-known/jwks.json
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
    asserts:
      - isKind:
          of: Secret
      - notExists:
          path: stringData.CLINICAL_JWT_SECRET
  - it: created secret rejects a short JWT secret in prod
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
      secrets.values.CLINICAL_API_TOKEN: "gggggggggggggggggggggggggggggggggggggggg"
      secrets.values.CLINICAL_JWT_SECRET: short
    asserts:
      - failedTemplate:
          errorPattern: "at least 32"
