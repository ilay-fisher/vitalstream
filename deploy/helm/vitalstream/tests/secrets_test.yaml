suite: secrets
templates:
  - deployment.yaml
  - secret.yaml
tests:
  - it: gateway reads its secrets from the secret, never inline
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: ingest-gateway
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: INGEST_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_PSEUDONYM_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: LOG_PSEUDONYM_KEY
  - it: copilot references admin token, mcp token, pseudonym key, db password and optional anthropic key
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: copilot
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: COPILOT_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: COPILOT_ADMIN_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: MCP_TOKEN
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: POSTGRES_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: ANTHROPIC_API_KEY
                optional: true
  - it: clinical-api composes the broker url from the secret password
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: clinical-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RABBITMQ_URL
            value: amqp://vitalstream:$(RABBITMQ_PASSWORD)@rabbitmq:5672
  - it: existingSecret overrides the secret name everywhere
    template: deployment.yaml
    set:
      secrets.existingSecret: my-secret
    documentSelector:
      path: metadata.name
      value: ingest-gateway
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGEST_API_KEY
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: INGEST_API_KEY
  - it: no Secret object is rendered by default
    template: secret.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: no Secret object is rendered when existingSecret is set even with create
    template: secret.yaml
    set:
      secrets.create: true
      secrets.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
  - it: chart can create the secret from values supplied at install time
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets
      - isNotEmpty:
          path: stringData.INGEST_API_KEY
  - it: created secret fails fast on a value shorter than 32 characters in prod
    template: secret.yaml
    set:
      secrets.create: true
      secrets.values.INGEST_API_KEY: short
      secrets.values.COPILOT_ADMIN_TOKEN: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      secrets.values.MCP_TOKEN: "cccccccccccccccccccccccccccccccccccccccc"
      secrets.values.LOG_PSEUDONYM_KEY: "dddddddddddddddddddddddddddddddddddddddd"
      secrets.values.POSTGRES_PASSWORD: "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
      secrets.values.RABBITMQ_PASSWORD: "ffffffffffffffffffffffffffffffffffffffff"
    asserts:
      - failedTemplate:
          errorPattern: "at least 32"
  - it: created secret fails when a required value is missing
    template: secret.yaml
    set:
      secrets.create: true
    asserts:
      - failedTemplate:
          errorPattern: "secrets.values.INGEST_API_KEY"
