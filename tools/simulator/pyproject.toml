[project]
name = "vitalstream-sim"
version = "0.1.0"
description = "VitalStream synthetic patient vitals simulator and load generator."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "jsonschema>=4.21",
    "rfc3339-validator>=0.1.4",
    "testcontainers>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
]

[project.scripts]
vitalstream-sim = "vitalstream_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalstream_sim"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (ingest-gateway, Kafka, Redis via Testcontainers)"]
addopts = "-m 'not integration' --cov=vitalstream_sim --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/vitalstream_sim/__main__.py"]
