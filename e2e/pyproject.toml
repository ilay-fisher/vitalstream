[project]
name = "vitalstream-e2e"
version = "0.1.0"
description = "End-to-end suite for the VitalStream compose stack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "confluent-kafka>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalstream_e2e"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

# Unit tests need no Docker; the e2e marker opts in to the real stack:
#   uv run pytest -m e2e -o addopts=""
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' --cov=vitalstream_e2e --cov-fail-under=80 --cov-report=term-missing"
markers = ["e2e: needs the full compose stack (make up); slow"]
