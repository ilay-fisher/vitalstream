# Trivy secret-scan allowlist (TRIVY_SECRET_CONFIG in ci.yml / release.yml). Secret scanning stays ON.
# One scoped false positive: docstrings in the Anthropic SDK contain a masked placeholder that matches
# the GCP service-account pattern. Review: 2026-12-15.
allow-rules:
  - id: anthropic-sdk-docstring
    description: Masked placeholder in docstrings of the vendored anthropic SDK (and their .pyc), not a credential.
    path: ^.*site-packages/anthropic/.*\.(py|pyc)$
