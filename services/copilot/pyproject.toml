[project]
name = "copilot"
version = "0.1.0"
description = "VitalStream clinical copilot: RAG over guidelines, LangGraph agent, REST + MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "elasticsearch[async]>=8.14,<9",
    "fastembed>=0.4",
    "langgraph>=0.2.50",
    "anthropic>=0.40",
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "testcontainers[postgres,elasticsearch]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
copilot = "copilot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "testcontainers.*", "pgvector.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = ["integration: needs Docker (Postgres+pgvector, Elasticsearch via Testcontainers)"]

[tool.coverage.run]
source = ["copilot"]
omit = ["*/main.py", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
