# Fragment merged into the stack by the root Makefile (docs/CONTRACTS.md section 8):
#   docker compose --project-directory . -f infra/compose.yaml -f services/ingest-gateway/compose.yaml up
# Paths below are relative to the repository root (the --project-directory).
services:
  ingest-gateway:
    build:
      context: services/ingest-gateway
    image: vitalstream/ingest-gateway:local
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-dev}
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      LOG_PSEUDONYM_KEY: ${LOG_PSEUDONYM_KEY:-dev-only-pseudonym-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,localhost:8081,127.0.0.1,127.0.0.1:8081,ingest-gateway,ingest-gateway:8081}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks:
      - vitalstream

networks:
  vitalstream:
    name: vitalstream
    external: false
