[project]
name = "stream-processor"
version = "0.1.0"
description = "VitalStream PySpark Structured Streaming job: windows, EWMA, NEWS2 and ML anomaly detection."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "pyspark==3.5.8",
  "numpy>=1.26,<2.3",
  "structlog>=24.4",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "chispa>=0.10",
  "fakeredis>=2.26",
  "ruff>=0.8",
  "mypy>=1.13",
  "testcontainers[kafka,redis]>=4.8",
  "confluent-kafka>=2.5",
  "cassandra-driver>=3.29",
  "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_processor"]

[project.scripts]
stream-processor = "stream_processor.main:main"
train-anomaly-model = "stream_processor.training:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "spark: tests that start a local SparkSession (no Docker)",
  "integration: needs Docker (Kafka, Cassandra, Redis); run with `pytest -m integration`",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["stream_processor"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
# Wiring is covered by the Testcontainers integration test, not the unit gate.
omit = ["*/main.py", "*/pipeline.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "jobs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "N", "D", "ANN"]
ignore = ["D203", "D213", "D107", "D105", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D103"]
"jobs/**" = ["D103"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/stream_processor"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "chispa.*", "confluent_kafka.*", "cassandra.*", "testcontainers.*"]
ignore_missing_imports = true
